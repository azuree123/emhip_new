<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">EMHIP</div>
    <h1 class="auth-card__title">Reset password</h1>

    @if (linkMissing) {
      <p class="auth-card__subtitle">This reset link is missing or invalid.</p>
      <a class="auth-link" routerLink="/forgot-password">Request a new link</a>
    } @else if (submitted()) {
      <div class="auth-success">Your password has been reset.</div>
      <a class="auth-link" style="margin-top: 20px;" routerLink="/login">Continue to sign in</a>
    } @else {
      <p class="auth-card__subtitle">Choose a new password for your account.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="auth-field">
          <span class="auth-field__label">New password</span>
          <input class="auth-field__input" type="password" formControlName="newPassword" autocomplete="new-password" placeholder="At least 8 characters" />
          @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
            <span class="auth-field__error">Password must be at least 8 characters.</span>
          }
        </label>

        <label class="auth-field">
          <span class="auth-field__label">Confirm password</span>
          <input class="auth-field__input" type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="Re-enter password" />
          @if (form.errors?.['mismatch'] && form.controls.confirmPassword.touched) {
            <span class="auth-field__error">Passwords do not match.</span>
          }
        </label>

        @if (errorMessage(); as message) {
          <div class="auth-error">{{ message }}</div>
        }

        <button class="auth-submit" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>
    }
  </div>
</div>
