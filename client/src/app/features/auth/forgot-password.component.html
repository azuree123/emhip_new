<div class="auth-page">
  <div class="auth-card">
    <emhip-logo class="auth-card__logo" [markSize]="44" [stacked]="true" tagline="Enhanced Mental Health in Primary care" />
    <h1 class="auth-card__title">Forgot password</h1>
    <p class="auth-card__subtitle">Enter your email and we'll send you a reset link.</p>

    @if (submitted()) {
      <div class="auth-success">If an account exists for that email, a reset link is on its way.</div>
      <a class="auth-link" style="margin-top: 20px;" routerLink="/login">Back to sign in</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <label class="auth-field">
          <span class="auth-field__label">Email</span>
          <input class="auth-field__input" type="email" formControlName="email" autocomplete="username" placeholder="you@emhip.local" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="auth-field__error">Enter a valid email address.</span>
          }
        </label>

        <button class="auth-submit" type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Sending…' : 'Send reset link' }}
        </button>

        <a class="auth-link" routerLink="/login">Back to sign in</a>
      </form>
    }
  </div>
</div>
