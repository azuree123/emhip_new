<div class="confirm-overlay" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <div class="confirm-dialog" [class.confirm-dialog--danger]="tone() === 'danger'">
    <div class="confirm-dialog__bar">
      <h2 class="confirm-dialog__title">{{ title() }}</h2>
      <button type="button" class="icon-btn" (click)="cancel()" [disabled]="busy()" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M 1 1 L 11 11 M 11 1 L 1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="confirm-dialog__body">
      <p class="confirm-dialog__message">{{ message() }}</p>

      @if (warning()) {
        <p class="confirm-dialog__warning">{{ warning() }}</p>
      }

      @if (reasonLabel(); as label) {
        <label class="field">
          <span class="field__label">{{ label }} <span class="field__optional">(optional)</span></span>
          <textarea
            class="textarea"
            rows="3"
            maxlength="500"
            placeholder="Why is this document being removed?"
            [value]="reason()"
            (input)="onReasonInput($event)"
          ></textarea>
          <span class="field__hint">Recorded against the document so it can be understood in the recycle bin.</span>
        </label>
      }

      @if (typedConfirmation(); as phrase) {
        <label class="field">
          <span class="field__label">Type <strong>{{ phrase }}</strong> to confirm</span>
          <input
            type="text"
            class="input"
            autocomplete="off"
            [attr.placeholder]="phrase"
            [value]="typed()"
            (input)="onTypedInput($event)"
          />
        </label>
      }

      @if (error()) {
        <p class="error-banner" role="alert">{{ error() }}</p>
      }
    </div>

    <div class="confirm-dialog__foot">
      <button type="button" class="btn btn--secondary" (click)="cancel()" [disabled]="busy()">Cancel</button>
      <button
        type="button"
        class="btn"
        [class.btn--danger]="tone() === 'danger'"
        [class.btn--primary]="tone() !== 'danger'"
        (click)="confirm()"
        [disabled]="!canConfirm()"
      >
        {{ busy() ? 'Working…' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
