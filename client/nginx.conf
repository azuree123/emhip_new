# Compression — Angular bundles compress ~4x; images/woff2 are already compressed.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening for the SPA (UK GDPR Art. 32). `always` keeps them on error pages too.
    # HSTS is only honoured over TLS, which the host-level proxy terminates in front of this
    # container; browsers ignore it on plain HTTP, so it is safe to emit unconditionally.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Angular renders with inline styles; scripts are only ever our own hashed bundles. Fonts
    # come from Google Fonts (see styles.scss) — the only third-party origin the app talks to.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # REST API — proxied so the SPA can call same-origin '/api/...'
    # (see src/environments/environment.prod.ts) with no CORS needed.
    location /api/ {
        proxy_pass http://api:8080/;
        # Document uploads: nginx's 1 MB default would reject them long before the
        # configurable per-file limit in Settings applies. Streamed, not spooled to disk.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub — needs WebSocket upgrade headers in addition to the standard proxy ones.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Long-lived WebSocket connections; SignalR pings every 15s, so this only
        # needs to outlast a stalled connection, not the session.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # index.html must always be revalidated — it's the pointer to the hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Angular emits content-hashed filenames, so everything else is safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Angular SPA — client-side routing, so unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
