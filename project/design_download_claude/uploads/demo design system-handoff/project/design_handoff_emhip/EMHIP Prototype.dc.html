<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens/fig-tokens.css">
  <link rel="stylesheet" href="screens/fig-assets.css">
  <script src="screens/Components.bundle.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #ECECEC; }
    a { color: #941C3C; } a:hover { color: #E12628; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif;">
  <div style="display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #2A2A2A; color: #FFFFFF; flex-shrink: 0; overflow-x: auto;">
    <div style="font-weight: 700; font-size: 14px; letter-spacing: 0.5px; white-space: nowrap;">EMHIP <span style="color: #8C8C8C; font-weight: 500;">Prototype</span></div>
    <div style="display: flex; gap: 6px;">
      <sc-for list="{{ screens }}" as="scr" hint-placeholder-count="9">
        <button onClick="{{ scr.select }}" style="border: 1px solid {{ scr.borderColor }}; background: {{ scr.bg }}; color: {{ scr.color }}; border-radius: 999px; padding: 6px 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">{{ scr.label }}</button>
      </sc-for>
    </div>
  </div>
  <div ref="{{ stageRef }}" style="flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px;">
    <div style="background: #FFFFFF; box-shadow: 0 2px 16px rgba(0,0,0,0.14); border-radius: 8px; width: 1440px; flex-shrink: 0; zoom: {{ scale }};">
      <x-import component-from-global-scope="{{ currentComponent }}" from="./screens/Components.bundle.js" hint-size="1440px,900px"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startScreen&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Dashboard&quot;, &quot;Dashboard2&quot;, &quot;GuestDataSheet&quot;, &quot;GuestOverviewTab&quot;, &quot;DmegographicsTab&quot;, &quot;InitialConversationTab&quot;, &quot;Desktop34&quot;, &quot;Desktop46&quot;, &quot;Desktop50&quot;], &quot;default&quot;: &quot;Dashboard&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Prototype&quot;}}">
class Component extends DCLogic {
  state = { screen: null, stageWidth: null };

  static SCREENS = [
    { key: 'Dashboard', label: 'Dashboard' },
    { key: 'Dashboard2', label: 'Service Overview' },
    { key: 'GuestDataSheet', label: 'Guest Data Sheet' },
    { key: 'GuestOverviewTab', label: 'Guest Workspace' },
    { key: 'DmegographicsTab', label: 'Register: Demographics' },
    { key: 'InitialConversationTab', label: 'Initial Conversation' },
    { key: 'Desktop34', label: 'Global Follow-up' },
    { key: 'Desktop46', label: 'Urgent Cases' },
    { key: 'Desktop50', label: 'Reports' },
  ];

  componentDidMount() {
    this._measure = () => {
      const el = this._stageEl;
      if (el && el.clientWidth !== this.state.stageWidth) this.setState({ stageWidth: el.clientWidth });
    };
    window.addEventListener('resize', this._measure);
    this._measure();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._measure);
  }

  renderVals() {
    const current = this.state.screen || this.props.startScreen || 'Dashboard';
    const screens = Component.SCREENS.map((s) => {
      const active = s.key === current;
      return {
        label: s.label,
        select: () => this.setState({ screen: s.key }),
        bg: active ? '#E12628' : 'transparent',
        color: active ? '#FFFFFF' : '#C9C9C9',
        borderColor: active ? '#E12628' : '#505050',
      };
    });
    const w = this.state.stageWidth;
    const scale = w ? Math.min(1, (w - 48) / 1440) : 1;
    const stageRef = (el) => {
      this._stageEl = el;
      if (el && this._measure) this._measure();
    };
    return { screens, currentComponent: current, scale, stageRef };
  }
}
</script>
</body>
</html>
